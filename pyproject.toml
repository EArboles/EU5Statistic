[project]
name = "eu5statistic"
version = "0.1.0"
description = "Statistics parser for EU5"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Egor Kulakov", email = "75932187+EArboles@users.noreply.github.com"},
]
keywords = ["eu5", "statistics", "parser"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "alembic>=1.20.1",
    "alembic_utils>=0.8.8",
    "annotated-types>=0.8.0",
    "asyncpg>=0.32.0",
    "flupy>=1.2.5",
    "ijson>=3.6.0",
    "Mako>=1.4.3",
    "MarkupSafe>=3.0.4",
    "parse>=1.22.4",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.2",
    "pydantic_core>=2.50.2",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.0",
    "sqlmodel>=0.0.48",
    "typing-inspection>=0.4.4",
    "typing_extensions>=4.16.0",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-asyncio",
    "black",
    "ruff",
    "mypy",
]



[project.urls]
Homepage = "https://github.com/EArboles/EU5Statistic"
Repository = "https://github.com/EArboles/EU5Statistic"
Issues = "https://github.com/EArboles/EU5Statistic/issues"

[project.scripts]
eu5statistic = "eu5statistic.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Опционально: настройки инструментов
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line-length обрабатывается formatter'ом

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = [
    "^src/eu5statistic/db/migrations/",
]
#strict = true